<div class="dashboard-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 class="brand-title">Biblio PY</h2>
    </div>
    <nav class="sidebar-menu">
      <a routerLink="/etudiant/mon-compte" routerLinkActive="active" class="menu-item">Mon compte</a>
      <a routerLink="/etudiant/suivi-emprunts" routerLinkActive="active" class="menu-item">Suivi des Emprunts</a>
      <a routerLink="/etudiant/historique" routerLinkActive="active" class="menu-item">Historique des emprunts</a>
      <a routerLink="/etudiant/mes-livres" routerLinkActive="active" class="menu-item">Mes livres</a>
      <a routerLink="/etudiant/notifications" routerLinkActive="active" class="menu-item">Notifs</a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div class="user-profile">
        <span class="user-name">trhrsgh fdhhfg</span>
        <div class="user-avatar">👤</div>
      </div>
    </header>

    <section class="content-body">
      <div class="back-navigation">
        <button class="btn-circle-back" routerLink="/etudiant/mes-livres">←</button>
      </div>

      <h1 class="page-title-center">Rendre le livre</h1>

      <div class="model-form-grid" *ngIf="livreDetails; else chargement">
        
        <div class="book-visual-wrapper">
          <img 
            [src]="livreDetails?.livre_details?.image || 'assets/images/default.png'" 
            class="model-book-cover" 
            alt="Couverture"
          >
        </div>

        <form (ngSubmit)="soumettreRetour()" class="model-form-inputs">
          <div class="model-input-group">
            <label>Nom du livre</label>
            <input type="text" [value]="livreDetails?.livre_details?.titre || 'Sans titre'" readonly class="model-input-disabled">
          </div>

          <div class="model-input-group">
            <label>Genre</label>
            <input type="text" [value]="livreDetails?.livre_details?.categorie || livreDetails?.livre_details?.filiere || 'Général'" readonly class="model-input-disabled">
          </div>

          <div class="model-input-group">
            <label>Date de rendue</label>
            <input type="date" [(ngModel)]="dateRetour" name="dateRetour" class="model-input-field">
          </div>

          <div class="model-input-group">
            <label>Ajouter un commentaire</label>
            <input type="text" [(ngModel)]="commentaire" name="commentaire" placeholder="Votre avis..." class="model-input-field">
          </div>

          <div class="model-input-group">
            <label>Donner une note</label>
            <div class="model-rating-stars">
              <span 
                *ngFor="let etoile of [1, 2, 3, 4, 5]" 
                class="model-star" 
                [class.active]="etoile <= note" 
                (click)="attribuerNote(etoile)"
              >
                ★
              </span>
            </div>
          </div>

          <div class="model-action-wrapper">
            <button type="submit" class="model-btn-yellow">Rendre le livre</button>
          </div>
        </form>

      </div>

      <ng-template #chargement>
        <div class="model-loading">
          <p>Récupération des données du livre en cours...</p>
        </div>
      </ng-template>

    </section>
  </main>
</div>
