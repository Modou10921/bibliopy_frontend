<div class='etudiant-layout'>
  <app-sidebar></app-sidebar>
  
  <div class='etudiant-content'>

    <h2>Notifications</h2>

    <div class='search-bar'>
      <input type='text' placeholder='Recherche une notification'
             [(ngModel)]="recherche" (input)="filtrer()">
    </div>

    <div class='notifications-list'>
      <div class='notif-card' *ngFor='let notif of notificationsFiltrees' [class.non-lue]='!notif.lue'>
        <div class="notif-body" style="display: flex; align-items: center; width: 100%;">
          
          <div *ngIf="!notif.livre_image" class="success-icon-circle" style="flex-shrink: 0; margin-right: 15px;">
            <span class="checkmark">✓</span>
          </div>

          <img *ngIf="notif.livre_image" [src]="notif.livre_image" class="notif-img" alt="livre" style="margin-right: 15px;">
          
          <div class='notif-content' style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
            
            <p class='notif-message' *ngIf="notif.message && notif.message.trim() !== ''" style="margin: 0; font-size: 15px; color: #333;">
              {{ notif.message }}
            </p>
            
            <p class='notif-message' *ngIf="!notif.message || notif.message.trim() === ''" style="margin: 0; font-size: 15px; color: #333;">
              
              <span *ngIf="notif.type === 'prolongation' || notif.statut === 'prolonge' || notif.action === 'prolongation' || notif.titre?.toLowerCase()?.includes('prolong') || notif.titre_notification?.toLowerCase()?.includes('prolong')">
                Votre demande de prolongation a été acceptée avec succès.
              </span>

              <span *ngIf="notif.type === 'retour' || notif.statut === 'rendu' || notif.statut === 'rend' || notif.action === 'retour' || notif.titre?.toLowerCase()?.includes('rendu') || notif.titre?.toLowerCase()?.includes('retour') || notif.titre_notification?.toLowerCase()?.includes('rendu') || notif.titre_notification?.toLowerCase()?.includes('retour')">
                Le livre a bien été retourné à la bibliothèque.
              </span>

              <span *ngIf="notif.type !== 'prolongation' && notif.statut !== 'prolonge' && notif.action !== 'prolongation' && notif.type !== 'retour' && notif.statut !== 'rendu' && notif.statut !== 'rend' && notif.action !== 'retour' && !notif.titre?.toLowerCase()?.includes('prolong') && !notif.titre?.toLowerCase()?.includes('rendu') && !notif.titre?.toLowerCase()?.includes('retour') && !notif.titre_notification?.toLowerCase()?.includes('prolong') && !notif.titre_notification?.toLowerCase()?.includes('rendu')">
                Action enregistrée avec succès.
              </span>
              
            </p>

            <small class='notif-date' style="font-size: 12px; color: #999;">
              {{ notif.date_creation | date:'dd/MM/yyyy HH:mm' }}
            </small>
          </div>

        </div>
      </div>
    </div>

    <p *ngIf='!notificationsFiltrees || notificationsFiltrees.length === 0' class='text-muted'>
      Aucune notification.
    </p>

  </div>
</div>
