<div class="page-container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <button class="btn-back" (click)="retour()">&#8592;</button>
      <span class="logo">BiblioPY</span>
    </div>
    <div class="header-right">
      <span class="admin-label">Admin</span>
      <div class="avatar">A</div>
    </div>
  </div>

  <div class="content">
    <h2 class="page-title">Statistiques</h2>

    <div class="loading" *ngIf="loading">Chargement des statistiques...</div>

    <div *ngIf="!loading && stats">

      <!-- GRAPHIQUE EMPRUNTS MENSUELS -->
      <div class="chart-card">
        <div class="chart-title purple-text">Emprunts Mensuels</div>
        <div class="bar-chart">
          <div class="bar-item" *ngFor="let item of empruntsParMois">
            <div class="bar-column">
              <div class="bar-fill-vertical" [style.height.%]="item.pct" [style.background]="getBarColor(item.pct)"></div>
            </div>
            <div class="bar-month-label">{{ item.label }}</div>
          </div>
        </div>
      </div>

      <!-- TOP LIVRES EMPRUNTES -->
      <div class="chart-card">
        <div class="chart-title purple-text">Top Livres Empruntés</div>
        <div class="top-livre" *ngFor="let item of topLivres; let i = index"
             [style.background]="i % 2 === 0 ? '#F5C518' : '#7C3AED'"
             [style.color]="i % 2 === 0 ? '#222' : '#fff'">
          {{ item }}
        </div>
        <div *ngIf="topLivres.length === 0" class="empty-msg">Aucune donnée disponible.</div>
      </div>

      <!-- RETARDS ACTUELS -->
      <div class="chart-card">
        <div class="chart-title purple-text">Retards Actuels</div>
        <div class="retard-row">
          <span class="retard-label">Emprunts en Retard</span>
          <span class="retard-badge">{{ stats.retards }}</span>
        </div>
      </div>

    </div>
  </div>
</div>
