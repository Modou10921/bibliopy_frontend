<header class="navbar">
  <div class="logo-area">
    <h1 class="brand-title" routerLink="/">BIBLIO PY</h1>
  </div>
</header>

<main class="detail-container" *ngIf="livre">
  <div class="back-action">
    <button routerLink="/" class="btn-back">←</button>
  </div>

  <div class="book-detail-wrapper">
    <div class="book-cover-section">
      <img [src]="livre.image" [alt]="livre.titre" class="main-cover-img" *ngIf="livre.image">
    </div>

    <div class="book-info-section">
      <h2 class="book-title">{{ livre.titre }}</h2>
      
      <div class="book-specs">
        <p><strong>Auteur :</strong> {{ livre.auteur }}</p>
        <p><strong>Catégorie :</strong> {{ livre.categorie }}</p>
        <p><strong>ISBN :</strong> {{ livre.isbn }}</p>
        <p><strong>Date de publication :</strong> {{ livre.date_publication }}</p>
      </div>

      <div class="book-metadata">
        <p><strong>Statut :</strong> <span class="status-badge available">Disponible</span></p>
      </div>

      <button class="btn-reserve" (click)="reserverLivre()">
        Réserver le livre
      </button>
    </div>
  </div>
</main>
