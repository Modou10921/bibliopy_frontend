  <div class="registration-container">
    <h1 class="title">INSCRIPTION</h1>
    
    <p class="login-link">
      Vous avez déjà un compte ? <a routerLink="/connexion">cliquez ici</a>
    </p>

    <form (ngSubmit)="onRegister()" class="form-container">
      
      <div class="input-group">
        <label>Prenom</label>
        <input type="text" [(ngModel)]="userData.prenom" name="prenom" required>
      </div>

      <div class="input-group">
        <label>Nom</label>
        <input type="text" [(ngModel)]="userData.nom" name="nom" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="userData.email" name="email" required>
      </div>

      <div class="input-group">
  <label>Mot de passe</label>
  <div class="input-with-icon">
    <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="userData.password" name="password" required>
    
    <div class="eye-box" (click)="togglePassword()">
      <span class="icon-eye">{{ showPassword ? '👁️' : '🙈' }}</span>
    </div>
  </div>
</div>

      <div class="checkbox-group">
        <input type="checkbox" id="adminCheck" [(ngModel)]="isAdmin" name="isAdmin">
        <label for="adminCheck">Admin</label>
      </div>

      <div class="input-group" *ngIf="!isAdmin">
        <label>Universite</label>
        <input type="text" [(ngModel)]="userData.universite" name="universite">
      </div>

      <div class="input-group" *ngIf="!isAdmin">
        <label>INE</label>
        <input type="text" [(ngModel)]="userData.ine" name="ine">
      </div>

      <button type="submit" class="btn-submit">S'INSCRIRE</button>
      
    </form>
  </div>
</div>
